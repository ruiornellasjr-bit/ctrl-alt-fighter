name: Publicar BBS Academy

on:
  push:
    branches:
      - main
    paths:
      - "BBS Academy/**"
      - ".github/workflows/deploy-bbs-academy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbs-academy-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos da Academy
        uses: actions/upload-pages-artifact@v4
        with:
          path: "BBS Academy"
      - name: Publicar BBS Academy
        id: deployment
        uses: actions/deploy-pages@v4
